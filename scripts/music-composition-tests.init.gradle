allprojects {
    afterEvaluate { project ->
        if (project.path == ':app') {
            project.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                if (name != 'compileDebugAndroidTestJavaWithJavac') return
                doFirst {
                    setSource(project.fileTree('src/androidTest/java') {
                        include '**/MusicCompositionIntegrationTest.java', '**/MusicPreviewTest.java'
                    })
                }
            }
        }
    }
}
